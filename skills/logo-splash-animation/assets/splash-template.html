<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
  :root{--ease:cubic-bezier(.65,0,.35,1)}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:{{BG}}}
  body{display:grid;place-items:center}
  #splash{width:min(72vmin,420px);aspect-ratio:1/1;cursor:pointer}
  #splash svg{width:100%;height:100%;display:block;overflow:visible}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--d,.6s) var(--ease) var(--t,0s) forwards}
  .pop{opacity:0;animation:on 1ms steps(1) var(--t,0s) forwards}
  .scan{opacity:0;animation:scan 1s linear {{SCAN_AT}}s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes on{to{opacity:1}}
  @keyframes scan{0%{opacity:1;transform:translateY(0)}90%{opacity:1}100%{opacity:0;transform:translateY(var(--travel))}}
  @media (prefers-reduced-motion:reduce){
    .draw,.pop{animation-duration:1ms!important;animation-delay:0s!important}
    .scan{display:none}
  }
</style>
</head>
<body>
<div id="splash" role="img" aria-label="{{TITLE}}">
{{SVG}}
</div>
<script>
  const DONE_MS = {{DONE_MS}};
  const fire = () => window.dispatchEvent(new CustomEvent("splash:done"));
  let timer = setTimeout(fire, DONE_MS);
  document.getElementById("splash").addEventListener("click", () => {
    clearTimeout(timer);
    const svg = document.querySelector("#splash svg");
    svg.replaceWith(svg.cloneNode(true));
    timer = setTimeout(fire, DONE_MS);
  });
  window.addEventListener("splash:done", () => {
    /* hook: navigate or hide the splash here, e.g. location.href = "/home" */
  });
</script>
</body>
</html>
